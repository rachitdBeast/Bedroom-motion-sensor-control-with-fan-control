blueprint:
  name: Advanced Motion Sensor - Lights and Ceiling Fan
  description: |
    Motion-controlled lights with optional ceiling fan control.

    Features
    - Several motion sensors; "no motion" actions only run when ALL sensors are off.
    - Lights: time window, sun elevation rule, brightness, optional ambient scene.
    - Manual override (on/off option, no helpers needed): the last activity of each light/fan is
      checked. If it was last turned OFF by a logged-in user (Home Assistant app or dashboard,
      or a voice assistant that passes the user), motion will not turn it on again until you
      turn it back on yourself. Changes with no user attached (automations, power loss and
      restore, a physical switch cutting power) are never treated as a manual override.
    - Sleep mode: a toggle (input_boolean or switch). While it is ON the motion automation is
      blocked, for example for an afternoon nap.
    - Ceiling fan: delayed start (so a quick walk-through does not start it), soft start at a lower
      speed, extra run-on time after lights go off, and an optional minimum temperature.

    Based on https://github.com/arturoliveira/home-assistant/blob/main/advanced_custom_motion_sensor.yaml
    Requires Home Assistant 2024.10 or newer.

  domain: automation
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/arturoliveira/home-assistant/blob/main/advanced_custom_motion_sensor.yaml
  input:
    motion_section:
      name: Motion and lights
      icon: mdi:motion-sensor
      collapsed: false
      input:
        motion_entity:
          name: Motion Sensor
          description: Motion sensors, or a group of them (anything switching between "on" and "off").
          selector:
            entity:
              multiple: true
        light_entities:
          name: Lights
          description: The lights you want to control.
          selector:
            entity:
              domain: light
              multiple: true
        no_motion_wait:
          name: Wait time
          description: Time to leave the light on after the last motion is detected.
          default: 120
          selector:
            number:
              min: 0
              max: 600
              unit_of_measurement: seconds
              mode: slider
              step: 1
        time_default_start:
          name: Only turn lights on after this time (Optional)
          description: Leave start and end equal (e.g. both 00:00:00) to disable the time window.
          default: "00:00:00"
          selector:
            time: {}
        time_default_end:
          name: Only turn lights on before this time (Optional)
          default: "00:00:00"
          selector:
            time: {}
        elevation:
          name: Sun rule for lights
          description: Turn the lights on always, or only when the sun is above or below the horizon.
          default: Always
          selector:
            select:
              options:
                - Always
                - Below horizon
                - Above horizon
        elevation_adjustment:
          name: Sun elevation adjustment (Optional)
          description: With a positive number the sun is treated as further above the horizon. For instance, +10 approximately means the trigger activates one hour before the sun is below the horizon.
          default: 0
          selector:
            number:
              min: -90
              max: 90
              unit_of_measurement: degrees
              mode: slider
              step: 1
        scene_ambient:
          name: Ambient Scene (Optional)
          description: Scene activated when no motion is detected. Leave empty to turn the lights off instead.
          default: ""
          selector:
            entity:
              domain:
                - scene
              multiple: false
        time_scene_ambient_start:
          name: Ambient time frame start (Optional)
          description: Leave start and end equal to disable the time window.
          default: "00:00:00"
          selector:
            time: {}
        time_scene_ambient_end:
          name: Ambient time frame end (Optional)
          default: "00:00:00"
          selector:
            time: {}

    override_section:
      name: Manual override and sleep mode
      icon: mdi:hand-back-left
      collapsed: true
      input:
        light_manual_override:
          name: Respect manual OFF for lights
          description: >
            If a light was last turned off by a user in Home Assistant (app, dashboard, voice),
            motion will not turn it on again until you turn it on yourself. Power loss or a
            physical switch cutting power is not counted. Other lights in the list still follow motion.
          default: true
          selector:
            boolean: {}
        fan_manual_override:
          name: Respect manual OFF for fan
          description: Same as above, for the ceiling fan.
          default: true
          selector:
            boolean: {}
        sleep_entity:
          name: Sleep mode toggle (Optional)
          description: An input_boolean or switch. While it is ON, motion will not turn anything on or off.
          default: []
          selector:
            entity:
              domain:
                - input_boolean
                - switch
              multiple: true
        sleep_turn_off_devices:
          name: Turn lights and fan off when sleep mode starts
          default: false
          selector:
            boolean: {}

    fan_section:
      name: Ceiling fan
      icon: mdi:ceiling-fan
      collapsed: true
      input:
        fan_entity:
          name: Fan (Optional)
          description: Leave empty to control only lights.
          default: []
          selector:
            entity:
              domain: fan
              multiple: true
        fan_speed:
          name: Fan speed
          description: The fan has 5 speeds - 20%, 40%, 60%, 80% and 100%.
          default: 60
          selector:
            number:
              min: 20
              max: 100
              unit_of_measurement: "%"
              mode: slider
              step: 20
        fan_start_delay:
          name: Fan start delay
          description: The fan only starts if motion is still detected after this time, so a quick walk-through does not start it.
          default: 10
          selector:
            number:
              min: 0
              max: 300
              unit_of_measurement: seconds
              mode: slider
              step: 1
        fan_soft_start:
          name: Soft start
          description: Start the fan at a low speed first, then move to the full speed.
          default: true
          selector:
            boolean: {}
        fan_soft_start_speed:
          name: Soft start speed
          description: Should be lower than the fan speed (20% is the lowest step).
          default: 20
          selector:
            number:
              min: 20
              max: 100
              unit_of_measurement: "%"
              mode: slider
              step: 20
        fan_soft_start_duration:
          name: Soft start duration
          default: 20
          selector:
            number:
              min: 1
              max: 120
              unit_of_measurement: seconds
              mode: slider
              step: 1
        fan_stop_delay:
          name: Fan extra run-on time
          description: How long the fan keeps running after the lights have gone off (and no motion was seen), so lights and fan do not stop at the same instant.
          default: 120
          selector:
            number:
              min: 0
              max: 900
              unit_of_measurement: seconds
              mode: slider
              step: 1
        fan_temp_sensor:
          name: Temperature sensor (Optional)
          description: If set, the fan only starts when the temperature is at or above the minimum below.
          default: ""
          selector:
            entity:
              domain: sensor
              device_class: temperature
        fan_min_temp:
          name: Minimum temperature to start fan
          default: 24
          selector:
            number:
              min: 10
              max: 40
              unit_of_measurement: degrees
              mode: slider
              step: 0.5

    blocker_section:
      name: Blockers
      icon: mdi:cancel
      collapsed: true
      input:
        automation_blocker_entities:
          name: Automation Blocker Entities (Optional)
          description: Motion actions only run if ALL of these entities are in the desired state (see next input).
          default: []
          selector:
            entity:
              multiple: true
        automation_blocker_boolean:
          name: Automation Blocker Desired State
          description: On if the blocker entities must be "on" for the automation to run, off if they must be "off".
          default: false
          selector:
            boolean: {}
        motion_off_blocker:
          name: Motion Off Blocker Entities (Optional)
          description: The motion-off sequence (lights off, ambient scene, fan off) only runs if ALL of these entities are in the desired state.
          default: []
          selector:
            entity:
              multiple: true
        motion_off_blocker_boolean:
          name: Motion Off Blocker Desired State
          default: false
          selector:
            boolean: {}

mode: parallel
max: 10
max_exceeded: silent

variables:
  motion_entity: !input motion_entity
  light_entities: !input light_entities
  elevation: !input elevation
  elevation_adjustment: !input elevation_adjustment
  scene_ambient: !input scene_ambient
  light_manual_override: !input light_manual_override
  fan_manual_override: !input fan_manual_override
  sleep_entity: !input sleep_entity
  sleep_turn_off_devices: !input sleep_turn_off_devices
  fan_entity: !input fan_entity
  fan_speed: !input fan_speed
  fan_start_delay: !input fan_start_delay
  fan_soft_start: !input fan_soft_start
  fan_soft_start_speed: !input fan_soft_start_speed
  fan_soft_start_duration: !input fan_soft_start_duration
  fan_stop_delay: !input fan_stop_delay
  fan_temp_sensor: !input fan_temp_sensor
  fan_min_temp: !input fan_min_temp
  automation_blocker_entities: !input automation_blocker_entities
  automation_blocker_boolean: !input automation_blocker_boolean
  motion_off_blocker: !input motion_off_blocker
  motion_off_blocker_boolean: !input motion_off_blocker_boolean
  # Lights whose last activity was a manual OFF (state is off and the change was made by a user)
  manual_off_lights: >-
    {%- set ns = namespace(l=[]) -%}
    {%- if light_manual_override -%}
    {%- for e in light_entities -%}
    {%- set s = states[e] -%}
    {%- if s is not none and s.state == 'off' and s.context.user_id is not none -%}
    {%- set ns.l = ns.l + [e] -%}
    {%- endif -%}
    {%- endfor -%}
    {%- endif -%}
    {{ ns.l }}
  lights_to_turn_on: "{{ light_entities | reject('in', manual_off_lights) | list }}"
  # True if a fan was last turned off by a person
  fan_manual_off: >-
    {%- set ns = namespace(f=false) -%}
    {%- if fan_manual_override -%}
    {%- for e in fan_entity -%}
    {%- set s = states[e] -%}
    {%- if s is not none and s.state == 'off' and s.context.user_id is not none -%}
    {%- set ns.f = true -%}
    {%- endif -%}
    {%- endfor -%}
    {%- endif -%}
    {{ ns.f }}

triggers:
  - trigger: state
    id: motion_on
    entity_id: !input motion_entity
    from: "off"
    to: "on"
  - trigger: state
    id: motion_off
    entity_id: !input motion_entity
    from: "on"
    to: "off"
    for:
      seconds: !input no_motion_wait
  - trigger: state
    id: sleep_on
    entity_id: !input sleep_entity
    to: "on"

conditions:
  - condition: or
    conditions:
      - condition: trigger
        id: sleep_on
      # Motion events: not blocked by blockers or sleep mode
      - condition: and
        conditions:
          - condition: template
            value_template: >-
              {{ (automation_blocker_entities | default([], true))
                 | reject('is_state', 'on' if automation_blocker_boolean else 'off')
                 | list | length == 0 }}
          - condition: template
            value_template: >-
              {{ (sleep_entity | default([], true))
                 | select('is_state', 'on') | list | length == 0 }}

actions:
  - choose:
      # ---------------- Sleep mode switched on ----------------
      - conditions:
          - condition: trigger
            id: sleep_on
        sequence:
          - if:
              - condition: template
                value_template: "{{ sleep_turn_off_devices }}"
            then:
              - action: light.turn_off
                target:
                  entity_id: !input light_entities
              - if:
                  - condition: template
                    value_template: "{{ (fan_entity | default([], true)) | length > 0 }}"
                then:
                  - action: fan.turn_off
                    target:
                      entity_id: !input fan_entity

      # ---------------- Motion detected ----------------
      - conditions:
          - condition: trigger
            id: motion_on
        sequence:
          # Lights (lights manually turned off are skipped)
          - if:
              - condition: time
                after: !input time_default_start
                before: !input time_default_end
              - condition: template
                value_template: >-
                  {{ elevation == 'Always'
                     or (is_number(state_attr('sun.sun', 'elevation'))
                         and ((elevation == 'Above horizon'
                               and state_attr('sun.sun', 'elevation') | float > elevation_adjustment | float)
                              or (elevation == 'Below horizon'
                                  and state_attr('sun.sun', 'elevation') | float <= elevation_adjustment | float))) }}
              - condition: template
                value_template: "{{ lights_to_turn_on | length > 0 }}"
            then:
              - action: light.turn_on
                target:
                  entity_id: "{{ lights_to_turn_on }}"
          # Fan: delayed, optionally soft-started
          - if:
              - condition: template
                value_template: "{{ (fan_entity | default([], true)) | length > 0 }}"
              - condition: template
                value_template: "{{ not fan_manual_off }}"
              - condition: template
                value_template: >-
                  {{ (fan_temp_sensor | default('', true)) == ''
                     or not is_number(states(fan_temp_sensor))
                     or states(fan_temp_sensor) | float(0) >= fan_min_temp | float(0) }}
              - condition: template
                value_template: >-
                  {{ (fan_entity | default([], true)) | select('is_state', 'off') | list | length
                     == (fan_entity | default([], true)) | length }}
            then:
              - delay:
                  seconds: "{{ fan_start_delay | int(0) }}"
              # Re-check everything after the delay
              - if:
                  - condition: template
                    value_template: "{{ expand(motion_entity) | selectattr('state', 'eq', 'on') | list | length > 0 }}"
                  - condition: template
                    value_template: >-
                      {{ (fan_entity | default([], true)) | select('is_state', 'off') | list | length
                         == (fan_entity | default([], true)) | length }}
                  - condition: template
                    value_template: >-
                      {{ (sleep_entity | default([], true))
                         | select('is_state', 'on') | list | length == 0 }}
                then:
                  - if:
                      - condition: template
                        value_template: "{{ fan_soft_start }}"
                    then:
                      - action: fan.turn_on
                        target:
                          entity_id: !input fan_entity
                        data:
                          percentage: "{{ [fan_soft_start_speed | int(20), fan_speed | int(60)] | min }}"
                      - delay:
                          seconds: "{{ fan_soft_start_duration | int(20) }}"
                      - if:
                          - condition: template
                            value_template: "{{ expand(motion_entity) | selectattr('state', 'eq', 'on') | list | length > 0 }}"
                          - condition: template
                            value_template: "{{ (fan_entity | default([], true)) | select('is_state', 'on') | list | length > 0 }}"
                          - condition: template
                            value_template: >-
                              {{ (sleep_entity | default([], true))
                                 | select('is_state', 'on') | list | length == 0 }}
                        then:
                          - action: fan.set_percentage
                            target:
                              entity_id: !input fan_entity
                            data:
                              percentage: "{{ fan_speed | int(60) }}"
                    else:
                      - action: fan.turn_on
                        target:
                          entity_id: !input fan_entity
                        data:
                          percentage: "{{ fan_speed | int(60) }}"

      # ---------------- No motion for the wait time ----------------
      - conditions:
          - condition: trigger
            id: motion_off
          # Every motion sensor must be off
          - condition: template
            value_template: "{{ expand(motion_entity) | selectattr('state', 'eq', 'on') | list | length == 0 }}"
          # Motion-off blocker
          - condition: template
            value_template: >-
              {{ (motion_off_blocker | default([], true))
                 | reject('is_state', 'on' if motion_off_blocker_boolean else 'off')
                 | list | length == 0 }}
        sequence:
          # Lights: ambient scene or off (the scene is skipped if a light was manually turned off)
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ scene_ambient not in ['', none, 'scene.none'] }}"
                  - condition: time
                    after: !input time_scene_ambient_start
                    before: !input time_scene_ambient_end
                  - condition: template
                    value_template: "{{ manual_off_lights | length == 0 }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ scene_ambient }}"
            default:
              - action: light.turn_off
                target:
                  entity_id: !input light_entities
          # Fan: keeps running a little longer than the lights
          - if:
              - condition: template
                value_template: "{{ (fan_entity | default([], true)) | length > 0 }}"
            then:
              - delay:
                  seconds: "{{ fan_stop_delay | int(0) }}"
              - if:
                  - condition: template
                    value_template: "{{ expand(motion_entity) | selectattr('state', 'eq', 'on') | list | length == 0 }}"
                  - condition: template
                    value_template: "{{ (fan_entity | default([], true)) | select('is_state', 'on') | list | length > 0 }}"
                then:
                  - action: fan.turn_off
                    target:
                      entity_id: !input fan_entity
